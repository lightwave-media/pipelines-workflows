name: release-tauri-app

# Tag → Release (release-core) → Tauri bundles built per-OS and attached to
# the existing Release. tauri-action uploads into the Release release-core
# created (it finds it by tag), so notes stay git-cliff's.
#
# NOTE: faithful canonical pattern; validated on createOS's migration — the
# first release path that repo has ever had (release_pipeline.yaml,
# tauri-app row). Bundle signing secrets are the repo's own.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      environment:
        description: "Optional GitHub Environment gating the build. Empty = no gate"
        type: string
        default: ""
      tauri_project_path:
        description: "Path containing src-tauri/"
        type: string
        default: "."
      # PRIVATE-SOURCE, PUBLIC-FEED: a private repo's release assets are not
      # fetchable unauthenticated, so an in-app updater polling them gets 404s.
      # Set both mirror_* inputs to publish the bundles, .sig files, and
      # latest.json to a PUBLIC repo instead (release-core's Release on the
      # source repo keeps the canonical notes; its body is copied onto the
      # mirror Release so users still see a changelog).
      mirror_owner:
        description: "Owner of the public mirror repo for release assets. Empty = attach assets to this repo's Release"
        type: string
        default: ""
      mirror_repo:
        description: "Name of the public mirror repo. Requires RELEASE_MIRROR_TOKEN"
        type: string
        default: ""
    secrets:
      NODE_AUTH_TOKEN:
        description: "Registry token for the frontend install (org PAT via `secrets: inherit`). Optional — falls back to the job token, which works only when the package grants the calling repo Actions access"
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Updater-artifact signing key (repo secret via `secrets: inherit`). Required once the repo's tauri.conf.json sets createUpdaterArtifacts — the bundler refuses to build updater artifacts unsigned"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Password for the signing key. Optional — omit for a passwordless key"
        required: false
      RELEASE_MIRROR_TOKEN:
        description: "Fine-grained PAT with contents read/write on the mirror repo only. Required when mirror_owner/mirror_repo are set"
        required: false

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/release-core.yml
    permissions:
      contents: write
      # Pass-through for release-core's shipped-in notifications; the repo
      # caller's own grant remains the outer ceiling (degrades to a warning).
      issues: write
      pull-requests: write
    with:
      dry_run: ${{ inputs.dry_run }}

  gate:
    name: Approval gate
    if: ${{ inputs.environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Approval recorded
        run: echo "Environment '${{ inputs.environment }}' approval recorded by ${{ github.actor }}."

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [release, gate]
    if: ${{ always() && needs.release.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # The frontend install below authenticates to GitHub Packages with the
      # job token (org-scoped deps like @lightwave-media/ui). Every tauri-app
      # caller must grant `packages: read` alongside `contents: write`.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from the repo's mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The Tauri v2 Linux prerequisite list (v2.tauri.app/start/prerequisites)
      # — webkit2gtk and friends. Without these the wry build fails at
      # pkg-config on every Linux runner.
      - name: Tauri system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-action runs the repo's beforeBuildCommand but installs nothing;
      # node_modules must exist before it. Same lockfile idiom as
      # release-node-package's publish job, plus bun (mise-action provides the
      # package manager the repo's mise.toml pins).
      - name: Install frontend dependencies
        working-directory: ${{ inputs.tauri_project_path }}
        env:
          # .npmrc resolves org-scoped registries through this token. The org
          # NODE_AUTH_TOKEN secret (via the caller's `secrets: inherit`) wins;
          # the bare job token 403'd on createOS's first run because the
          # package had not granted that repo Actions access.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else echo "::error::No lockfile — a release without one is not reproducible."; exit 1
          fi

      # Idempotent and matrix-race-safe (same keep-existing idiom as
      # release-core): whichever OS leg arrives first creates the mirror
      # Release, carrying the
      # source Release's git-cliff notes so the public feed has a changelog.
      # tauri-action then finds it by tag and uploads into it — releaseCommitish
      # never comes into play, which matters because the source SHA does not
      # exist in the mirror repo.
      - name: Ensure the mirror Release exists (public updater feed)
        if: ${{ inputs.mirror_repo != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          MIRROR: ${{ inputs.mirror_owner }}/${{ inputs.mirror_repo }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$MIRROR" > /dev/null 2>&1; then
            echo "mirror release $TAG already exists — leaving it (keep-existing)."
            exit 0
          fi
          GH_TOKEN="$SRC_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > /tmp/mirror-notes.md || : > /tmp/mirror-notes.md
          gh release create "$TAG" --repo "$MIRROR" --title "$TAG" \
            --notes-file /tmp/mirror-notes.md

      - name: Build + attach bundles to the Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          # With a mirror configured, tauri-action talks to the MIRROR repo and
          # needs the PAT; latest.json then carries mirror URLs, which is the
          # whole point — a public feed for apps built from private source.
          GITHUB_TOKEN: ${{ inputs.mirror_repo != '' && secrets.RELEASE_MIRROR_TOKEN || secrets.GITHUB_TOKEN }}
          # Updater-artifact signing (repos with createUpdaterArtifacts).
          # tauri-action also uploads the .sig files and the latest.json
          # manifest (uploadUpdaterJson defaults true at the pinned SHA), which
          # is what the in-app updater polls via releases/latest/download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ inputs.tauri_project_path }}
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: false
          # Empty strings fall back to the calling repo inside the action.
          owner: ${{ inputs.mirror_owner }}
          repo: ${{ inputs.mirror_repo }}

  dry-run-note:
    name: Dry run — bundles skipped
    needs: [release]
    if: ${{ inputs.dry_run && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "dry_run — release-core validated the tag and notes; Tauri bundles skipped."
