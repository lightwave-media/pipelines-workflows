name: release-go-binary

# Tag → Release (release-core) → GoReleaser build + publish.
# Mirrors lightwave-cli's proven flow (same action SHAs, same GoReleaser
# version). The repo's .goreleaser.yaml must set
# `release.mode: keep-existing` — release-core creates the Release with
# git-cliff notes and GoReleaser attaches artifacts to it.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      environment:
        description: "Optional GitHub Environment gating the publish. Empty = no gate"
        type: string
        default: ""
      goreleaser_version:
        type: string
        default: "v2.14.3"

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/release-core.yml
    permissions:
      contents: write
      # Pass-through for release-core's shipped-in notifications; the repo
      # caller's own grant remains the outer ceiling (degrades to a warning).
      issues: write
      pull-requests: write
    with:
      dry_run: ${{ inputs.dry_run }}

  gate:
    name: Approval gate
    if: ${{ inputs.environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Approval recorded
        run: echo "Environment '${{ inputs.environment }}' approval recorded by ${{ github.actor }}."

  publish:
    name: GoReleaser publish
    needs: [release, gate]
    if: ${{ always() && needs.release.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      # A `Mint tap-push token` step stood here, minting a GitHub App token
      # scoped to `repositories: homebrew-tap` and passing it to GoReleaser as
      # HOMEBREW_TAP_TOKEN for the `brews:` block to push a formula.
      #
      # lightwave-media/homebrew-tap was DELETED on 2026-09-16. The step was
      # guarded on the TAP_APP_* secrets being present rather than on the tap
      # existing, and those secrets are still set on lightwave-cli — so the
      # guard stayed true and the next real release would have tried to scope a
      # token to a repository that does not resolve. A guard on the wrong
      # condition is not a guard.
      #
      # lightwave-cli dropped its `brews:` block in lightwave-cli#486, so there
      # is nothing left to push even if the token minted. Tagged releases still
      # publish cross-platform tarballs to the GitHub Release, which is how
      # other machines get the binary.
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: ${{ inputs.goreleaser_version }}
          args: release --clean ${{ inputs.dry_run && '--skip=publish,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Darwin binaries for the repo's own notarization workflow, if any
      # (lightwave-cli's sign-macos.yml). Harmless when unused; expire in 7d.
      - name: Upload darwin binaries for notarization
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lw_darwin_amd64
          path: dist/*_darwin_amd64*/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload darwin/arm64 binaries for notarization
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lw_darwin_arm64
          path: dist/*_darwin_arm64*/*
          retention-days: 7
          if-no-files-found: ignore
