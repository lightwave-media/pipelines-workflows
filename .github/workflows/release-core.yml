name: release-core

# The shared spine of every Lightwave release (policy/governance/
# release_pipeline.yaml in lightwave-core — the stamp this implements).
#
# Called by the release-<type> workflows in this repo, never by consumers
# directly. Given a pushed tag it:
#   1. validates the tag names a commit reachable from the default branch
#      (a release of an unmerged commit is not a release, it is an accident);
#   2. derives the version from the tag (the tag IS the version — module
#      prefixes like `nulltickets/v1.2.3` are understood);
#   3. generates release notes with git-cliff from conventional commits since
#      the previous tag of the same prefix — one config, inlined here, so
#      every repo's changelog is produced by the same bytes;
#   4. creates the GitHub Release (or, on dry_run, prints what it would do).
#
# Determinism: no floating action refs, no network version lookups, gh CLI
# from the runner image for the Release call, git-cliff executed at a pinned
# version through mise. Same tag in, same Release out.

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Run everything but skip creating the Release"
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub Release as a prerelease (auto-detected from a -suffix if unset)"
        type: boolean
        default: false
    outputs:
      version:
        description: "SemVer derived from the tag (no prefix)"
        value: ${{ jobs.core.outputs.version }}
      tag:
        description: "The full tag name"
        value: ${{ jobs.core.outputs.tag }}

permissions: {}

jobs:
  core:
    name: Validate + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the shipped-in feedback loop below. Callers that grant only
      # contents:write still work — the notify step degrades to a warning.
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - name: Checkout (full history — tag ancestry + changelog need it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert the tag is reachable from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on ${DEFAULT_BRANCH}. Releases are cut from merged history only."
            exit 1
          fi
          echo "tag commit is on ${DEFAULT_BRANCH}"

      - name: Derive version from tag
        id: derive
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # Strip an optional module prefix (`nulltickets/v1.2.3`) then the v.
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag ${TAG} does not end in a SemVer (v<major>.<minor>.<patch>[-pre][+build])."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version $VERSION from tag $TAG"

      - name: Install mise (pins git-cliff below)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5  # pinned: unset resolves LATEST mid-publish (lightwave-core#474)
          install: false

      - name: Generate release notes (git-cliff, one org-wide config)
        id: notes
        env:
          TAG: ${{ steps.derive.outputs.tag }}
        run: |
          # BEGIN RELEASE NOTES HELPER (executed verbatim by local CI)
          set -euo pipefail
          export NOTES_DIR="$RUNNER_TEMP/release-notes"
          mkdir -p "$NOTES_DIR"
          # One config for the whole org, inlined so every repo's notes are
          # produced by identical bytes. Change it here, nowhere else.
          tee "$NOTES_DIR/cliff.toml" > /dev/null <<'CLIFF'
          [changelog]
          header = ""
          body = """
          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group | upper_first }}
          {% for commit in commits %}
          - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})
          {%- endfor %}
          {% endfor %}
          """
          footer = ""
          trim = true

          [git]
          conventional_commits = true
          filter_unconventional = false
          commit_parsers = [
            { message = "^feat", group = "Features" },
            { message = "^fix", group = "Bug fixes" },
            { message = "^perf", group = "Performance" },
            { message = "^refactor", group = "Refactoring" },
            { message = "^docs", group = "Documentation" },
            { message = "^ci|^build", group = "CI & build" },
            { message = "^test", group = "Tests" },
            { message = "^chore\\(main\\): release", skip = true },
            { message = ".*", group = "Other" },
          ]
          CLIFF
          python3 - <<'PY'
          import glob
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import quote

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          tag = os.environ["TAG"]
          prefix = tag.rsplit("/", 1)[0] + "/" if "/" in tag else ""
          # Start at the target's parent, not HEAD or the newest tag in the
          # repository: a rerun must not include a later release's commits.
          target = git("rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}")
          parent = subprocess.run(
              ["git", "rev-parse", "--verify", f"{target}^"],
              capture_output=True, text=True,
          )
          previous = ""
          if parent.returncode == 0:
              described = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0",
                   "--match", glob.escape(prefix) + "v[0-9]*",
                   "--exclude", glob.escape(prefix) + "v*/*", parent.stdout.strip()],
                  capture_output=True, text=True,
              )
              if described.returncode == 0:
                  previous = described.stdout.strip()
              elif described.returncode != 128:
                  raise RuntimeError(described.stderr)
          revision_range = f"{previous}..{target}" if previous else target
          notes_dir = Path(os.environ["NOTES_DIR"])
          full_notes = notes_dir / "full-notes.md"
          subprocess.run(
              ["mise", "x", "git-cliff@2.11.0", "--", "git-cliff",
               "--config", str(notes_dir / "cliff.toml"),
               "--tag-pattern", "^" + re.escape(prefix) + r"v[0-9].*$",
               "--tag", tag, "--output", str(full_notes), revision_range],
              check=True,
          )
          repository_url = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
          if previous:
              history_url = repository_url + "/compare/" + quote(previous, safe="") + "..." + quote(tag, safe="")
          else:
              history_url = repository_url + "/commits/" + quote(tag, safe="")
          full_body = full_notes.read_text(encoding="utf-8")
          # GitHub rejects bodies over 125000 characters. A stricter byte
          # ceiling also covers Unicode and leaves room below that limit.
          limit = 120000
          footer = f"\n\n[Full commit history]({history_url})\n"
          body = full_body + footer
          if len(body.encode("utf-8")) > limit:
              footer = "\n\nRelease notes abbreviated to fit GitHub's limit." + footer
              budget = limit - len(footer.encode("utf-8"))
              excerpt = full_body.encode("utf-8")[:budget].decode("utf-8", errors="ignore")
              # Prefer complete lines; a single oversized commit message
              # still gets a bounded excerpt and an explicit notice.
              if "\n" in excerpt:
                  excerpt = excerpt.rsplit("\n", 1)[0]
              body = excerpt + footer
          if len(body.encode("utf-8")) > limit:
              raise RuntimeError("release notes still exceed the publication limit")
          (notes_dir / "notes.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"range={revision_range}\n")
              output.write(f"path={notes_dir / 'notes.md'}\n")
          print(f"Validated {len(body.encode('utf-8'))} note bytes for {revision_range}")
          PY
          echo "── notes ──"
          tee /dev/stderr < "$NOTES_DIR/notes.md" > /dev/null
          # END RELEASE NOTES HELPER

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.derive.outputs.tag }}
          VERSION: ${{ steps.derive.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease);; esac
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it (keep-existing; artifact jobs attach to it)."
          else
            # "${FLAGS[@]}" on an empty array expands to nothing (bash >= 4.4);
            # the :- form expanded to one EMPTY STRING positional, which
            # gh treated as a file pattern: `no matches found for ''`.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$NOTES_PATH" --verify-tag "${FLAGS[@]}"
          fi

      # ── Close the feedback loop ──────────────────────────────────────
      # Every squash-merge subject carries its PR number `(#N)`, and PRs
      # carry `Closes #M` for the issues they fix. Commenting "shipped in
      # <tag>" on each referenced PR (GitHub threads it to the linked
      # issues' timelines) tells the REQUESTING agent its fix is now
      # consumable — the return half of the issue → PR → release loop.
      # Idempotent: a marker search skips numbers already notified for this
      # tag, so re-runs never double-comment.
      - name: Notify shipped PRs and issues
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.derive.outputs.tag }}
          RANGE: ${{ steps.notes.outputs.range }}
        run: |
          set -euo pipefail
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          MARKER="shipped-in:${TAG}"
          # PR numbers from squash subjects in this release's range.
          NUMS=$(git log --format=%s "$RANGE" | { grep -oE '\(#[0-9]+\)$' || true; } | tr -d '(#)' | sort -un)
          [ -z "$NUMS" ] && { echo "no PR-referencing commits in $RANGE"; exit 0; }
          for n in $NUMS; do
            if gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" --paginate                  --jq '.[].body' 2>/dev/null | grep -q "$MARKER"; then
              echo "#${n}: already notified for ${TAG}"
              continue
            fi
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${n}/comments"                  -f body="🚀 Shipped in [\`${TAG}\`](${RELEASE_URL}). <!-- ${MARKER} -->" > /dev/null 2>&1; then
              echo "#${n}: notified"
            else
              echo "::warning::Could not comment on #${n} — grant issues:write + pull-requests:write in the caller's release job to enable shipped-in notifications."
            fi
          done

      - name: Dry run — Release skipped
        if: ${{ inputs.dry_run }}
        run: echo "dry_run — would have created Release ${{ steps.derive.outputs.tag }} with the notes above."
