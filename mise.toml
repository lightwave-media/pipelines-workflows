# Toolchain + the ONE CI gate for the plane repo itself: `mise run ci`.

[tools]
shellcheck = "0.11.0"

[tasks.ci]
description = "THE CI gate: shellcheck + action pins"
run = """
set -eu
shellcheck --severity=warning scripts/*.sh
bash scripts/check-actions-pinned-test.sh
bash scripts/check-actions-pinned.sh
echo "plane CI green"
"""
